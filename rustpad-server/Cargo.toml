[package]
name = "rustpad-server"
version = "0.1.0"
authors = ["Eric Zhang <ekzhang1@gmail.com>"]
edition = "2021"

[dependencies]
anyhow = "1.0.40"
bytecount = "0.6"
dashmap = "6.1"
dotenvy = "0.15.7"
futures = "0.3.15"
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
log = "0.4.14"
operational-transform = { version = "0.6.0", features = ["serde"] }
parking_lot = "0.12"
pretty_env_logger = "0.5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.126", features = ["derive"] }
serde_json = "1.0.64"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql"] }
tokio = { version = "1.48", features = ["full", "test-util"] }
tokio-stream = "0.1.6"
warp = { version = "0.4", features = ["server", "websocket"] }

[dev-dependencies]
tempfile = "3.23"
warp = { version = "0.4", features = ["test"] }
