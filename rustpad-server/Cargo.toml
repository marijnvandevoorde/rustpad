[package]
name = "rustpad-server"
version = "0.1.0"
authors = ["Eric Zhang <ekzhang1@gmail.com>"]
edition = "2021"

[dependencies]
anyhow = "1.0.104"
bytecount = "0.6.9"
dashmap = "6.1"
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
log = "0.4.34"
operational-transform = { version = "0.6.1", features = ["serde"] }
parking_lot = "0.12.5"
pretty_env_logger = "0.5"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql"] }
tokio = { version = "1.53", features = ["full", "test-util"] }
tokio-stream = "0.1.19"
warp = { version = "0.4.3", features = ["server", "websocket"] }

[dev-dependencies]
tempfile = "3.27"
warp = { version = "0.4", features = ["test"] }
